name: p2p-telegram

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: p2p-jackett
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
    volumes:
      - ./data/jackett:/config
    ports:
      - "127.0.0.1:9117:9117"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9117"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: p2p-qbittorrent
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Europe/Madrid}"
      WEBUI_PORT: "8081"
      TORRENTING_PORT: "${TORRENTING_PORT:-6881}"
    volumes:
      - ./data/qbittorrent:/config
      - "${DOWNLOADS_DIR:-./data/downloads}:/downloads"
    ports:
      - "127.0.0.1:8081:8081"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/tcp"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
