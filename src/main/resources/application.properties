quarkus.http.port=8080
app.telegram.token=${TELEGRAM_BOT_TOKEN:__UNSET__}
app.telegram.allowed-user=${TELEGRAM_ALLOWED_USER_ID:0}
app.jackett.url=${JACKETT_URL:http://localhost:9117}
app.jackett.key=${JACKETT_API_KEY:__UNSET__}
app.qbit.url=${QBIT_URL:http://localhost:8081}
app.qbit.user=${QBIT_USER:admin}
app.qbit.password=${QBIT_PASSWORD:__UNSET__}
app.state.db-url=${STATE_DB_URL:jdbc:sqlite:p2p-telegram.db}
app.http.connect-timeout-seconds=${HTTP_CONNECT_TIMEOUT_SECONDS:5}
app.http.request-timeout-seconds=${HTTP_REQUEST_TIMEOUT_SECONDS:12}
app.http.get-retry-attempts=${HTTP_GET_RETRY_ATTEMPTS:3}
